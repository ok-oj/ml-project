[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "owen jr.", email = "owentsebe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.scripts]
ml-project = "ml_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-watch>=4.2.0",
    "ruff>=0.17.3",
]
